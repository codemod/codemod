[package]
name = "depq"
version = "0.1.0"
edition = "2021"
description = "Prototype: one dependency graph across lockfile formats, queryable like ast-grep queries code"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
semver = "1"
node-semver = "2"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }

# Its own workspace, so it builds inside the codemod repo without joining the root workspace.
[workspace]
