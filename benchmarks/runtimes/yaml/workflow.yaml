# yaml-language-server: $schema=../../../schemas/workflow.json
#
# Benchmark arm `yaml`: the two benchmark transforms as js-ast-grep steps for
# the existing Rust workflow engine (`codemod workflow run`). `transforms` is
# a symlink to ../transforms because js_file must be a relative path inside
# the workflow directory. File selection must stay identical to ts/workflow.ts.
# No max_threads: the engine's default (min(available_parallelism, 12)).

version: "1"

nodes:
  - id: benchmark
    name: Runtime benchmark transforms
    type: automatic
    steps:
      - name: console-to-logger
        js-ast-grep:
          js_file: transforms/console-to-logger.ts
          language: typescript
          include:
            - "**/*.{ts,mts,cts,js,mjs,cjs}"
          exclude:
            - "**/node_modules/**"
      - name: rename-vitest-import
        js-ast-grep:
          js_file: transforms/rename-vitest-import.ts
          language: typescript
          include:
            - "**/*.{ts,mts,cts,js,mjs,cjs}"
          exclude:
            - "**/node_modules/**"
