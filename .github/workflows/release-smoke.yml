name: Release Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact published codemod version (e.g., 2.0.0 or 2.0.0-alpha.10)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.platform == 'win32-x64-msvc' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64-gnu
            runner: ubuntu-22.04
          - platform: linux-arm64-gnu
            runner: ubuntu-22.04-arm
          - platform: linux-x64-musl
            runner: ubuntu-22.04
            alpine: true
          - platform: linux-arm64-musl
            runner: ubuntu-22.04-arm
            alpine: true
          - platform: win32-x64-msvc
            runner: windows-2022
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: ${{ !matrix.alpine }}
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run release smoke
        if: ${{ !matrix.alpine }}
        shell: bash
        run: bash .github/scripts/smoke-release.sh
      # Use native Alpine Node so npm and the wrapper select the musl package.
      - name: Run release smoke in Alpine
        if: matrix.alpine
        shell: bash
        run: |
          docker run --rm \
            --env RELEASE_VERSION --env EXPECTED_PLATFORM \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/checkout,readonly" \
            node:24-alpine sh -ec 'apk add --no-cache bash git && bash /checkout/.github/scripts/smoke-release.sh'
