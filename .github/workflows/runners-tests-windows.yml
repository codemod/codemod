name: Runner tests (Windows)

on:
  push:
    branches: [main]
    paths:
      - "crates/agents/**"
      - "crates/runners/**"
      - "crates/workflow/**"
      - "crates/models/**"
      - "crates/llrt-capabilities/**"
      - "crates/state/**"
      - "crates/cli/src/**"
      - "crates/cli/tests/control_e2e.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/runners-tests-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/agents/**"
      - "crates/runners/**"
      - "crates/workflow/**"
      - "crates/models/**"
      - "crates/llrt-capabilities/**"
      - "crates/state/**"
      - "crates/cli/src/**"
      - "crates/cli/tests/control_e2e.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/runners-tests-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runners-tests-windows:
    name: Runner tests (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run agent tests
        run: cargo test --locked -p codemod-agents

      - name: Run runner tests
        run: cargo test --locked -p butterflow-runners

      - name: Run YAML workflow compatibility tests
        run: cargo test --locked -p codemod-workflow --test compat

      - name: Run run outcome tests (fail(), output, uncommitted changes)
        run: cargo test --locked -p codemod-workflow --test outcome

      - name: Run codemod/assess tests
        run: |
          cargo test --locked -p codemod-workflow --test assess
          cargo test --locked -p codemod-workflow --lib "assess::"

      - name: Run run store tests (journal, leases)
        run: cargo test --locked -p butterflow-state

      - name: Run rejected, paused and canceled run tests
        run: |
          cargo test --locked -p codemod-workflow --test tasks -- reject canceled approval
          cargo test --locked -p codemod-workflow --test engine -- stop

      - name: Run control channel and attach tests
        shell: bash
        run: |
          # The CLI embeds the report UI; the tests don't use it.
          mkdir -p crates/cli/report-ui/dist
          echo '<html></html>' > crates/cli/report-ui/dist/index.html
          cargo test --locked -p codemod --test control_e2e
