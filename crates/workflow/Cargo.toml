[package]
name = "codemod-workflow"
description = "Code-first workflow engine: step(), forEachFile and tasks for TypeScript workflows"
authors.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
butterflow-core = { workspace = true }
butterflow-models = { workspace = true }
butterflow-runners = { workspace = true }
butterflow-state = { workspace = true }
chrono = { workspace = true }
codemod-agents = { workspace = true }
codemod-ai = { path = "../ai" }
codemod-deps = { path = "../deps" }
codemod-llrt-capabilities = { workspace = true }
codemod-sandbox = { path = "../codemod-sandbox", features = ["native"] }
ignore = { workspace = true }
oxc = { version = "0.99.0", features = ["transformer", "codegen", "semantic"] }
rquickjs = { version = "0.11", default-features = false, features = ["loader", "macro", "classes", "properties", "futures"] }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
