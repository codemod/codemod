[package]
name = "jssg-napi"
version.workspace = true
edition = "2021"
publish = false
description = "napi-rs facade over the binding-agnostic JSSG AST core (SgRoot/SgNode) for the Node runtime of the TypeScript orchestration prototype"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codemod-sandbox = { workspace = true }
ast-grep-core = { workspace = true }
ast-grep-config = { workspace = true }
# The JSSG batch rules shared with the QuickJS host.
jssg-batch = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json", "dyn-symbols"] }
napi-derive = "3"
serde_json = { workspace = true }
# Native file selection for the orchestration `node` runtime.
orchestration-walker = { path = "../orchestration-walker" }
bench-timings = { workspace = true }

[features]
default = []
# Benchmark timings (CODEMOD_TIMINGS_FILE): `timingsPhases()` reports the
# addon's phases to the Node CLI, which writes the file.
timings = ["bench-timings/timings", "orchestration-walker/timings"]

[dev-dependencies]
sha2 = "0.10"
tempfile = { workspace = true }

[build-dependencies]
napi-build = "2"
