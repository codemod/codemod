# Convert deprecated MySQL functions to modern PDO equivalents
# This helps modernize legacy PHP codebases
id: mysql-query-to-pdo
language: php
rule:
  pattern: mysql_query($$$ARGS)
fix: $pdo->query($$$ARGS)
---
id: mysql-fetch-array-to-pdo
language: php
rule:
  pattern: mysql_fetch_array($RESULT)
fix: $RESULT->fetch(PDO::FETCH_BOTH)
---
id: mysql-fetch-assoc-to-pdo
language: php
rule:
  pattern: mysql_fetch_assoc($RESULT)
fix: $RESULT->fetch(PDO::FETCH_ASSOC)
