# Codemod Studio uses ast-grep to match and rewrite code.
# https://ast-grep.github.io/guide/rule-config.html#rule
id: replace-fmt-println-with-log
language: go
rule:
  pattern: fmt.Println($$$ARGS)
fix: log.Println($$$ARGS)
---
id: replace-fmt-printf-with-log
language: go
rule:
  pattern: fmt.Printf($$$ARGS)
fix: log.Printf($$$ARGS)
