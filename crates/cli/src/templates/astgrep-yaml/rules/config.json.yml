# Convert snake_case JSON keys to camelCase
# This helps modernize API responses and configuration files
id: snake-case-to-camel-case
language: json
rule:
  # The text of a key, without its quotes
  kind: string_content
  pattern: $KEY
  regex: ^[a-z][a-z0-9]*(_[a-z0-9]+)+$
  inside:
    kind: string
    inside:
      kind: pair
      field: key
transform:
  CAMEL_CASE:
    convert:
      source: $KEY
      toCase: camelCase
fix: $CAMEL_CASE
