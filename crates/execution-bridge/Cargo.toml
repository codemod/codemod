[package]
name = "butterflow-execution-bridge"
version.workspace = true
edition = "2021"
authors.workspace = true
description = "JSON request/completion bridge (shell, batched JSSG, and agent) for the TypeScript orchestration prototype"
documentation.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
butterflow-models = { workspace = true }
codemod-ai = { path = "../ai" }
butterflow-runners = { workspace = true }
# The JSSG batch rules shared with the in-process runtimes.
jssg-batch = { workspace = true }
codemod-sandbox = { workspace = true, features = ["native"] }
language-core = { workspace = true }
semantic-factory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A private directory for the Codex last-message file.
tempfile = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Hashes fixture transform sources.
sha2 = "0.10"
# Only the walker parity contract uses the walker; the bridge itself never
# enumerates a repository.
ignore = { workspace = true }
