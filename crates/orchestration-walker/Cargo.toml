[package]
name = "orchestration-walker"
version.workspace = true
edition = "2021"
authors.workspace = true
description = "Native file selection for the TypeScript orchestration runtimes: packages/orchestration/src/execution/files.ts (and the `ignore` npm package it uses) reproduced exactly in Rust"
documentation.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
libc = "0.2"
# ECMAScript regular expressions (non-unicode mode, UTF-16 code units), so
# node-ignore's generated `RegExp` sources match exactly as they do in JS.
regress = { version = "0.10", features = ["utf16"] }
# Fast path for rules whose JS semantics the `regex` crate provably shares
# on ASCII paths (`node_ignore::fast_source`).
regex = { workspace = true }
bench-timings = { workspace = true }

[features]
default = []
# Benchmark timings: CPU time of the walk and read worker threads.
timings = ["bench-timings/timings"]

[dev-dependencies]
tempfile = { workspace = true }
