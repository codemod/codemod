[package]
name = "orchestration-build"
version.workspace = true
edition = "2021"
authors.workspace = true
description = "Builds a TypeScript orchestration workflow into one QuickJS bundle: the jssg() split and the rolldown bundle"
documentation.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
# The rolldown the CLI already uses for `jssg bundle`, so the CLI links one copy.
rolldown = { git = "https://github.com/rolldown/rolldown.git", rev = "3d1985ab40923590b3ae9f626b2438d9543dc588" }
rolldown_common = { git = "https://github.com/rolldown/rolldown.git", rev = "3d1985ab40923590b3ae9f626b2438d9543dc588" }
rolldown_plugin = { git = "https://github.com/rolldown/rolldown.git", rev = "3d1985ab40923590b3ae9f626b2438d9543dc588" }
# The oxc that rolldown revision uses.
oxc = { version = "=0.96.0", features = ["semantic", "transformer", "codegen"] }
anyhow = "1"
arcstr = "1.2"
hex = "0.4"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
regex = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
