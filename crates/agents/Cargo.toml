[package]
name = "codemod-agents"
description = "Launch coding agents (Claude Code, Codex, Gemini CLI, ...) headlessly, stream their work as normalized events, and detect when running inside one"
authors.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
