[package]
name = "codemod-flow"
description = "Spike: step() and forEachFile for TypeScript workflows"
authors.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
codemod-sandbox = { path = "../codemod-sandbox", features = ["native"] }
ignore = { workspace = true }
oxc = { version = "0.99.0", features = ["transformer", "codegen", "semantic"] }
rquickjs = { version = "0.11", default-features = false, features = ["loader", "macro", "classes", "properties"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
